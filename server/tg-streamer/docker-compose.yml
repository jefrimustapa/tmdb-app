# TGStrm on Firebat. TLS and the public hostname (tgstrm.julietmike.net) are handled by Nginx Proxy Manager.
services:
  tg-streamer:
    image: ghcr.io/jefrimustapa/tg-streamer:${TGSTRM_TAG:-latest}
    container_name: tg-streamer
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3033"
      DATA_DIR: /data
    ports:
      - "${TGSTRM_HOST_PORT:-3033}:3033"
    volumes:
      - ./data:/data
    networks:
      - npm_default

networks:
  npm_default:
    external: true
